name: flutter_mozjpeg
description: A Flutter wrapper for mozjpeg.
version: 0.0.4
repository: https://github.com/espresso3389/flutter_mozjpeg

environment:
  sdk: ^3.5.3
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true

